<svg xmlns="http://www.w3.org/2000/svg" width="112" height="20" role="img" aria-label="Open in Obsidian">
  <title>Open in Obsidian</title>
  <linearGradient id="lo-obsidian-s" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="lo-obsidian-r">
    <rect width="112" height="20" rx="3" fill="#fff"/>
  </clipPath>
  <g clip-path="url(#lo-obsidian-r)">
    <rect width="53" height="20" fill="#555"/>
    <rect x="53" width="59" height="20" fill="#6c31e3"/>
    <rect width="112" height="20" fill="url(#lo-obsidian-s)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif" font-size="11" text-rendering="geometricPrecision">
    <text aria-hidden="true" x="26.5" y="15" fill="#010101" fill-opacity=".3" textLength="43">Open in</text>
    <text x="26.5" y="14" textLength="43">Open in</text>
    <text aria-hidden="true" x="82.5" y="15" fill="#010101" fill-opacity=".3" textLength="49">Obsidian</text>
    <text x="82.5" y="14" textLength="49">Obsidian</text>
  </g>
</svg>
