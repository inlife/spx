  <g fill="#fff" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif" font-size="11" text-rendering="geometricPrecision">
    <text aria-hidden="true" x="26.5" y="15" fill="#010101" fill-opacity=".3" textLength="43">Open in</text>
    <text x="26.5" y="14" textLength="43">Open in</text>
    <text aria-hidden="true" x="68.5" y="15" fill="#010101" fill-opacity=".3" textLength="21">app</text>
