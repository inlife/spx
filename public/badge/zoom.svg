<svg xmlns="http://www.w3.org/2000/svg" width="95" height="20" role="img" aria-label="Open in Zoom">
  <title>Open in Zoom</title>
  <linearGradient id="lo-zoom-s" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>
  <clipPath id="lo-zoom-r">
    <rect width="95" height="20" rx="3" fill="#fff"/>
  </clipPath>
  <g clip-path="url(#lo-zoom-r)">
    <rect width="53" height="20" fill="#555"/>
    <rect x="53" width="42" height="20" fill="#0b5cff"/>
    <rect width="95" height="20" fill="url(#lo-zoom-s)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif" font-size="11" text-rendering="geometricPrecision">
    <text aria-hidden="true" x="26.5" y="15" fill="#010101" fill-opacity=".3" textLength="43">Open in</text>
    <text x="26.5" y="14" textLength="43">Open in</text>
    <text aria-hidden="true" x="74" y="15" fill="#010101" fill-opacity=".3" textLength="32">Zoom</text>
    <text x="74" y="14" textLength="32">Zoom</text>
  </g>
</svg>
